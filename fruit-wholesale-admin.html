<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<title>훈이네과일야채 과일 완전도매 | 사장님</title>
<meta name="description" content="훈이네과일야채 과일 완전도매 사장님 페이지. 들어온 박스 발주 확인·상태 변경, 품목별 단가·품절·최소주문금액 관리.">
<style>
*{box-sizing:border-box}
:root{
  --navy:#1E293B; --navy-2:#0F172A;
  --orange:#EA580C; --orange-d:#C2410C; --orange-l:#FFF2E8; --orange-line:#FCD9BC;
  --bg:#F8FAFC; --card:#fff; --line:#E5E9F0; --line-2:#D5DCE6;
  --ink:#0F172A; --ink2:#475467; --ink3:#8A94A6;
  --green:#0F7B3F; --green-l:#E8F7EE;
  --blue:#0B63A8; --blue-l:#E7F3FF;
  --sh:0 1px 2px rgba(15,23,42,.05),0 8px 22px rgba(15,23,42,.05);
  --r:16px;
}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.1px}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.app{max-width:940px;margin:0 auto;min-height:100vh;padding-bottom:40px}

/* 헤더 */
.hd{background:var(--navy);color:#fff;padding:14px 16px 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(234,88,12,.5),rgba(234,88,12,0) 70%)}
.hd-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hd-name{font-size:18px;font-weight:800;letter-spacing:-.5px}
.hd-name em{font-style:normal;font-size:11.5px;font-weight:800;color:#FFE4CF;background:rgba(234,88,12,.3);
  border:1px solid rgba(253,186,116,.5);border-radius:6px;padding:1.5px 6px;margin-left:5px;vertical-align:2px}
.hd-sub{margin-top:3px;font-size:12.5px;color:#B9C4D4}
.hd-link{margin-left:auto;height:38px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:800;display:inline-flex;
  align-items:center;gap:4px;flex:0 0 auto}

/* 탭 */
.tabs{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex}
.tabs button{flex:1 1 0;height:56px;font-size:15.5px;font-weight:800;color:var(--ink3);position:relative;
  display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:-.3px}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:3px;
  background:var(--orange);border-radius:3px 3px 0 0}
.tabs .bubble{min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;
  font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}

/* 요약 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 2px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.stat .lb{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:-.2px}
.stat .vl{margin-top:3px;font-size:20px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.stat .vl small{font-size:12.5px;font-weight:800;color:var(--ink3);margin-left:1px;letter-spacing:-.2px}
.stat.hot .vl{color:var(--orange-d)}
.stat.money .vl{font-size:17.5px}

/* 상태 필터 */
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 4px}
.filters button{flex:0 0 auto;height:38px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line-2);
  background:#fff;font-size:13.5px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;letter-spacing:-.3px}
.filters button .n{font-size:12px;font-weight:800;color:var(--ink3)}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filters button.on .n{color:#CBD5E1}

.olist{padding:10px 14px 20px;display:flex;flex-direction:column;gap:11px}
@media(min-width:980px){ .olist{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start} }

.ocard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.ocard.new{border-color:var(--orange-line);box-shadow:0 0 0 3px rgba(234,88,12,.07),0 1px 2px rgba(15,23,42,.04)}
.orow{display:flex;align-items:center;gap:8px}
.oshop{font-size:17px;font-weight:800;letter-spacing:-.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:-.2px;border-radius:7px;padding:3px 8px;background:#EFF2F6;color:var(--ink2)}
.chip.s0{background:#EEF4FF;color:#2456A6}
.chip.s1{background:var(--orange-l);color:var(--orange-d)}
.chip.s2{background:var(--blue-l);color:var(--blue)}
.chip.s3{background:var(--green-l);color:var(--green)}
.ono{margin-top:3px;font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.1px;font-variant-numeric:tabular-nums}
.ometa{margin-top:5px;font-size:12.5px;color:var(--ink3);font-weight:700;letter-spacing:-.2px}
.olines{list-style:none;margin:9px 0 0;padding:9px 0 0;border-top:1px dashed #E7EBF1}
.olines li{display:flex;gap:7px;align-items:baseline;font-size:13.5px;padding:3px 0}
.olines li .nm{font-weight:800;letter-spacing:-.2px}
.olines li .sp{color:var(--ink3);font-size:12px;font-weight:700}
.olines li .qt{margin-left:auto;font-weight:800;color:var(--orange-d);flex:0 0 auto}
.olines li .am{flex:0 0 82px;text-align:right;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.ototal{display:flex;align-items:baseline;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);font-weight:700}
.ototal b{margin-left:auto;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.7px}
.oclient{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.6;letter-spacing:-.2px}
.oclient span{display:block}
.oclient b{color:var(--ink);font-weight:800}
.oclient .tel{display:inline-block;padding:1px 0;font-size:14.5px;letter-spacing:-.2px}
.omemo{margin-top:7px;font-size:12.5px;color:#7C4A12;background:#FFF8EC;border:1px solid #F7E3C3;
  border-radius:9px;padding:7px 9px;line-height:1.5;letter-spacing:-.2px}
.osteps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:11px}
.osteps button{height:42px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;
  font-size:13.5px;font-weight:800;color:var(--ink3);letter-spacing:-.3px}
.osteps button.done{background:#F6F9FC;border-color:#E1E8F0;color:#7E8DA1}
.osteps button.now{background:var(--navy);border-color:var(--navy);color:#fff}
.osteps button.next{color:var(--ink2);border-color:var(--line-2)}
.osteps button:active{transform:scale(.985)}
.oempty{text-align:center;color:var(--ink3);font-size:14px;line-height:1.7;padding:36px 12px;letter-spacing:-.2px}
.oempty b{display:block;font-size:15.5px;color:var(--ink2);margin-bottom:4px}

/* 품목·단가 */
.panel{padding:14px 14px 20px}
.minbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.minbox h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.4px}
.minbox p{margin:3px 0 10px;font-size:12.5px;color:var(--ink3);letter-spacing:-.2px}
.minrow{display:flex;align-items:center;gap:8px}
.minrow input{flex:1 1 auto;min-width:0;height:50px;border:1.5px solid var(--line-2);border-radius:12px;
  padding:0 13px;font-size:17px;font-weight:800;text-align:right;outline:none;appearance:none;font-variant-numeric:tabular-nums}
.minrow input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,41,59,.08)}
.minrow .won{font-size:16px;font-weight:800;color:var(--ink2)}

.ihead{padding:16px 2px 8px}
.ihead h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.4px}
.ihead p{margin:3px 0 0;font-size:12.5px;color:var(--ink3);font-weight:700;letter-spacing:-.2px;line-height:1.5}

.ilist{display:flex;flex-direction:column;gap:9px}
.irow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:10px 11px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.irow .th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#F1F4F8}
.irow .th img{width:100%;height:100%;object-fit:cover}
.irow .nm{font-size:15px;font-weight:800;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .sp{font-size:12px;color:var(--ink3);font-weight:700;margin-top:1px}
.irow .pr{display:flex;align-items:center;gap:5px}
.irow .pr input{width:104px;height:44px;border:1.5px solid var(--line-2);border-radius:10px;padding:0 9px;
  font-size:15px;font-weight:800;text-align:right;outline:none;appearance:none;font-variant-numeric:tabular-nums}
.irow .pr input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,41,59,.08)}
.irow .pr .u{font-size:13px;font-weight:800;color:var(--ink3)}
.irow.sold .th img{filter:grayscale(.8);opacity:.7}
.irow.sold .nm{color:var(--ink3)}
.tglrow{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed #EDF0F5;margin-top:2px}
.tgl{width:52px;height:30px;border-radius:15px;background:#E3E9F1;position:relative;transition:background .14s;flex:0 0 auto}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(15,23,42,.2);transition:transform .14s}
.tgl.on{background:var(--orange)}
.tgl.on::after{transform:translateX(22px)}
.tgl-lb{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:-.2px}
.tgl-lb.on{color:var(--orange-d)}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 6px;margin-top:14px;
  border-top:1px solid var(--line);box-shadow:0 -6px 14px rgba(248,250,252,.9)}
.savebar .row{display:flex;gap:8px;align-items:center}
.savebar .dirty{font-size:12.5px;font-weight:800;color:var(--orange-d);letter-spacing:-.2px}
.primary{flex:1 1 auto;height:54px;border-radius:13px;background:var(--orange);color:#fff;font-size:17px;
  font-weight:800;letter-spacing:-.4px;box-shadow:0 6px 16px rgba(234,88,12,.24)}
.primary:active{background:var(--orange-d)}
.ghost{flex:0 0 auto;height:54px;padding:0 16px;border-radius:13px;border:1.5px solid var(--line-2);
  background:#fff;font-size:15px;font-weight:800;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);z-index:80;
  background:rgba(15,23,42,.94);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.3px;border-radius:12px;
  padding:11px 16px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ft{padding:18px 14px 26px;text-align:center;font-size:11.5px;color:var(--ink3);line-height:1.7;letter-spacing:-.2px}
.sync{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:-.2px}
.sync.off{color:#B45309}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-row">
      <div>

        <div style="margin-top:7px"><span class="dirty" id="dirty"></span> <span class="sync" id="syncState"></span></div>

</div>

<div class="toast" id="toast" role="status"></div>

<script>

  { key: "received",  label: "접수",   short: "접수" },

function statusInfo(key){
  for (var i = 0; i < STATUS.length; i++) if (STATUS[i].key === key) return { s: STATUS[i], idx: i };
  return { s: STATUS[0], idx: 0 };
}
function statusIdx(key){ return statusInfo(key).idx; }

/* ── 저장 키 ────────────────────────────────────────────────────── */
var MIN_ORDER_DEFAULT = 200000;
var CAT_KEY   = "hoonie_fw_catalog_v1";  // 사장님이 고친 단가·품절·최소주문금액
var ORD_KEY   = "hoonie_fw_orders_v1";   // 이 기기가 아는 발주서 (손님은 자기 것만)
var MINE_KEY  = "hoonie_fw_mine_v1";     // 이 기기에서 넣은 발주번호
var CUST_KEY  = "hoonie_fw_customer_v1"; // 최근 발주한 상호·연락처·주소

/* ── 공용 저장소 (Supabase app_state) ─────────────────────────────
   기기 저장소는 빠른 캐시로 두고, 사장님 화면과 손님 화면이 다른 기기여도
   같은 단가·발주서를 보도록 공용 DB에도 함께 저장한다.
   인터넷이 없거나 file:// 로 열면 이 기기 저장소만으로 그대로 동작한다. */
var SB_URL      = "https://hiulxicbowkffoxjtvye.supabase.co";
var SB_KEY      = "sb_publishable_89p69vS6pSVQBJfImjKMrw__mvxKVg3";
var SB_CATALOG  = "fruit_wholesale_catalog";
var SB_ORDERS   = "fruit_wholesale_orders";
var SB_POLL_MS  = 5000;
var FORCE_OFFLINE = false;

/* 테스트·점검용: 공용 DB 접속을 끄고 이 기기 저장소만 쓴다 */
function offline(){ FORCE_OFFLINE = true; }
function setOffline(v){ FORCE_OFFLINE = !!v; }
function sbOn(){
  return !FORCE_OFFLINE && !!window.fetch && /^https?:$/.test(location.protocol);
}
function sbCall(path, opt){
  opt = opt || {};
  opt.headers = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY,
                  "Content-Type": "application/json" };
  if (opt.headersExtra) { for (var k in opt.headersExtra) opt.headers[k] = opt.headersExtra[k]; delete opt.headersExtra; }
  if (opt.cache === false) opt.cache = "no-store";
  return fetch(SB_URL + "/rest/v1/" + path, opt).then(function(r){
    if (!r.ok) throw new Error("supabase " + r.status);
    if (r.status === 204) return null;
    var ct = r.headers.get("content-type") || "";
    return ct.indexOf("json") > -1 ? r.json() : null;
  });
}
function sbGet(key){
  return sbCall("app_state?key=eq." + encodeURIComponent(key) + "&select=value", { cache: false })
    .then(function(rows){ return (rows && rows[0]) ? rows[0].value : null; });
}
function sbPut(key, doc){
  return sbCall("app_state", {
    method: "POST",
    headersExtra: { "Prefer": "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify([{ key: key, value: doc, updated_at: new Date().toISOString() }])
  });
}

/* 공용 DB 쓰기는 한 줄로 세워 보낸다 — 빠르게 두 번 누르면
   읽기·쓰기가 엇갈려 이전 상태가 마지막에 남는 일을 막는다. */
var pushQ = Promise.resolve();
function sbQueue(fn){
  pushQ = pushQ.then(fn, fn);
  return pushQ;
}

/* ── 기기 저장소 ────────────────────────────────────────────────── */
function readDoc(key, dflt){
  try {
    var v = JSON.parse(localStorage.getItem(key) || "null");
    return (v && typeof v === "object") ? v : dflt;
  } catch (e) { return dflt; }
}
function writeDoc(key, v){
  try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
}

/* ── 카탈로그: 단가·품절·최소주문금액 ──────────────────────────── */
function defaultCat(){ return { minOrder: MIN_ORDER_DEFAULT, items: {}, updatedAt: 0 }; }
function loadCat(){
  var d = readDoc(CAT_KEY, defaultCat());
  if (!d.items) d.items = {};
  if (!d.minOrder) d.minOrder = MIN_ORDER_DEFAULT;
  return d;
}
function saveCat(doc){ writeDoc(CAT_KEY, doc); }
function baseItem(id){
  for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
  return null;
}
function itemPrice(id){
  var ov = (loadCat().items || {})[id] || {};
  if (ov.price != null && ov.price !== "") return Number(ov.price);
  var b = baseItem(id);
  return b ? b.price : 0;
}
function itemSoldOut(id){
  var ov = (loadCat().items || {})[id] || {};
  return !!ov.soldout;
}
function minOrder(){ return Number(loadCat().minOrder || MIN_ORDER_DEFAULT); }
function catalogPush(doc){
  doc.updatedAt = Date.now();
  saveCat(doc);
  if (!sbOn()) return Promise.resolve(false);
  return sbQueue(function(){
    return sbPut(SB_CATALOG, doc).then(function(){ return true; }).catch(function(){ return false; });
  });
}
/* 화면에 마지막으로 반영한 카탈로그 시각.
   같은 브라우저에 손님·사장님 화면을 같이 열어 두면 기기 저장소(localStorage)를
   함께 쓰기 때문에, 서버 시각 비교만으로는 놓칠 수 있어 시각 자체가 바뀌었는지도 본다. */
var lastCatAt = -1;
function catalogFresh(){
  var at = Number(loadCat().updatedAt || 0);
  if (at === lastCatAt) return false;
  lastCatAt = at;
  return true;
}

function catalogPull(){
  if (!sbOn()) return Promise.resolve(false);
  return sbGet(SB_CATALOG).then(function(remote){
    if (!remote || !remote.items) return false;
    var local = loadCat();
    if (Number(remote.updatedAt || 0) <= Number(local.updatedAt || 0)) return false;
    saveCat(remote);
    return true;
  }).catch(function(){ return false; });
}

/* ── 발주서 ─────────────────────────────────────────────────────── */
function loadOrders(){
  var d = readDoc(ORD_KEY, { orders: [], updatedAt: 0 });
  if (!d.orders) d.orders = [];
  return d;
}
function saveOrders(doc){ writeDoc(ORD_KEY, doc); }
function loadMine(){
  var m = readDoc(MINE_KEY, { nos: [] });
  return (m && m.nos) ? m.nos : [];
}
function addMine(no){
  var nos = loadMine();
  if (nos.indexOf(no) === -1) nos.unshift(no);
  writeDoc(MINE_KEY, { nos: nos.slice(0, 100) });
}
function mergeOrderLists(base, incoming){
  var map = {}, i;
  for (i = 0; i < base.length; i++) map[base[i].no] = base[i];
  var changed = false;
  for (i = 0; i < incoming.length; i++) {
    var o = incoming[i], cur = map[o.no];
    if (!cur) { map[o.no] = o; changed = true; continue; }
    if (Number(o.statusAt || 0) > Number(cur.statusAt || 0) || Number(o.updatedAt || 0) > Number(cur.updatedAt || 0)) {
      map[o.no] = o; changed = true;
    }
  }
  var list = [];
  for (var k in map) if (map.hasOwnProperty(k)) list.push(map[k]);
  list.sort(function(a, b){ return Number(b.at || 0) - Number(a.at || 0); });
  return { list: list, changed: changed };
}
/* 손님 화면은 내 발주만, 사장님 화면은 전부 남긴다 */
var KEEP_ALL_ORDERS = false;
function orderPushDoc(){
  var local = loadOrders();
  saveOrders(local);
  if (!sbOn()) return Promise.resolve(false);
  return sbGet(SB_ORDERS).then(function(remote){
    var rList = (remote && remote.orders) ? remote.orders : [];
    var merged = mergeOrderLists(rList, local.orders);
    var doc = { orders: merged.list.slice(0, 400), updatedAt: Date.now() };
    return sbPut(SB_ORDERS, doc).then(function(){ return true; });
  }).catch(function(){ return false; });
}
function orderPull(){
  if (!sbOn()) return Promise.resolve(false);
  return sbGet(SB_ORDERS).then(function(remote){
    if (!remote || !remote.orders || !remote.orders.length) return false;
    var mine = loadMine();
    var keep = KEEP_ALL_ORDERS ? remote.orders : remote.orders.filter(function(o){
      return mine.indexOf(o.no) > -1;
    });
    var local = loadOrders();
    var merged = mergeOrderLists(local.orders, keep);
    if (!merged.changed) return false;
    saveOrders({ orders: merged.list, updatedAt: Date.now() });
    return true;
  }).catch(function(){ return false; });
}
/* 발주 접수: 이 기기 저장 → 공용 DB */
function orderAdd(o){
  var local = loadOrders();
  var merged = mergeOrderLists(local.orders, [o]);
  saveOrders({ orders: merged.list, updatedAt: Date.now() });
  addMine(o.no);
  if (!sbOn()) return Promise.resolve(false);
  return sbQueue(orderPushDoc);
}
/* 사장님 상태 변경: 이 기기 저장 → 공용 DB */
function orderSetStatus(no, st){
  var local = loadOrders(), hit = null;
  for (var i = 0; i < local.orders.length; i++){
    if (local.orders[i].no === no){
      local.orders[i].status = st;
      local.orders[i].statusAt = Date.now();
      hit = local.orders[i];
    }
  }
  saveOrders(local);
  if (!sbOn() || !hit) return Promise.resolve(false);
  return sbQueue(function(){ return sbGet(SB_ORDERS).then(function(remote){
    var doc = remote || { orders: [] };
    if (!doc.orders) doc.orders = [];
    var found = false;
    for (var j = 0; j < doc.orders.length; j++){
      if (doc.orders[j].no === no){
        doc.orders[j].status = st;
        doc.orders[j].statusAt = hit.statusAt;
        found = true;
      }
    }
    if (!found) doc.orders.unshift(hit);
    doc.updatedAt = Date.now();
    return sbPut(SB_ORDERS, doc).then(function(){ return true; });
  }).catch(function(){ return false; });
  });
}

/* ── 화면 공통 유틸 ─────────────────────────────────────────────── */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function won(n){
  var v = Math.round(Number(n || 0));
  return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function kgText(n){
  var v = Math.round(Number(n || 0) * 10) / 10;
  return (v % 1 === 0 ? String(v) : v.toFixed(1)) + "kg";
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function ymd(d){
  d = d || new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function mdText(s){
  if (!s) return "-";
  var p = String(s).split("-");
  if (p.length < 3) return s;
  return Number(p[1]) + "/" + Number(p[2]);
}
function dtText(ts){
  if (!ts) return "";
  var d = new Date(Number(ts));
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function digits(s){ return String(s || "").replace(/[^0-9]/g, ""); }
function tomorrowISO(){
  var d = new Date();
  d.setDate(d.getDate() + 1);
  return ymd(d);
}
function orderNo(){
  var d = new Date();
  return "FW" + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate())
       + "-" + String(Math.floor(Math.random() * 9000) + 1000);
}
function itemsText(lines){
  return lines.map(function(l){ return l.name + " " + l.qty + "박스"; }).join(" · ");
}

/* 화면 아래 짧은 안내 */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2600);
}

var state = { tab: "orders", filter: "all", dirty: false, editing: false };

function orders(){ return loadOrders().orders; }

/* ── 발주 목록 ── */
function todayStr(){ return ymd(); }
function monthStr(){ var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
function renderStats(){
  var list = orders(), waiting = 0, today = 0, monthSum = 0;
  list.forEach(function(o){
    if ((o.status || "received") === "received") waiting++;
    var d = o.shipDate || "";
    if (String(o.no || "").indexOf("FW" + todayStr().replace(/-/g, "")) === 0) today++;
    if (String(o.no || "").indexOf("FW" + monthStr().replace(/-/g, "")) === 0) monthSum += Number(o.total || 0);
  });
  document.getElementById("stats").innerHTML =
      '<div class="stat hot"><div class="lb">새 발주</div><div class="vl">' + waiting + '<small>건</small></div></div>'
    + '<div class="stat"><div class="lb">오늘 발주</div><div class="vl">' + today + '<small>건</small></div></div>'
    + '<div class="stat money"><div class="lb">이번 달</div><div class="vl">' + won(monthSum) + '<small>원</small></div></div>';
  var tb = document.getElementById("tabNew");
  if (waiting) { tb.hidden = false; tb.textContent = waiting; } else { tb.hidden = true; }
}
function renderFilters(){
  var list = orders(), counts = { all: list.length };
  STATUS.forEach(function(s){ counts[s.key] = 0; });
  list.forEach(function(o){ var k = o.status || "received"; counts[k] = (counts[k] || 0) + 1; });
  var h = '<button type="button" data-f="all" class="' + (state.filter === "all" ? "on" : "") + '">전체 <span class="n">' + counts.all + '</span></button>';
  STATUS.forEach(function(s){
    h += '<button type="button" data-f="' + s.key + '" class="' + (state.filter === s.key ? "on" : "") + '">'
       + s.label + ' <span class="n">' + (counts[s.key] || 0) + '</span></button>';
  });
  document.getElementById("filters").innerHTML = h;
}
function renderOrders(){
  var list = orders().filter(function(o){
    return state.filter === "all" || (o.status || "received") === state.filter;
  });
  var el = document.getElementById("olist");
  if (!list.length) {
    el.innerHTML = '<div class="oempty"><b>아직 들어온 발주가 없습니다</b>'
      + '손님 화면에서 20만원 이상 담아 발주하면 여기 바로 들어옵니다.</div>';
    return;
  }
  el.innerHTML = list.map(function(o){
    var st = statusInfo(o.status), idx = st.idx;
    var steps = STATUS.map(function(s, i){
      var cls = i < idx ? "done" : (i === idx ? "now" : "next");
      return '<button type="button" class="' + cls + '" data-no="' + esc(o.no) + '" data-st="' + s.key + '"'
           + (i === idx ? ' aria-current="step"' : '') + '>' + s.label + '</button>';
    }).join("");
    var lines = (o.items || []).map(function(l){
      return '<li><span class="nm">' + esc(l.name) + '</span><span class="sp">' + esc(l.spec) + '</span>'
           + '<span class="qt">' + l.qty + '박스</span><span class="am">' + won(l.sum) + '원</span></li>';
    }).join("");
    return '<article class="ocard' + (idx === 0 ? ' new' : '') + '">'
      + '<div class="orow"><span class="oshop">' + esc(o.shop) + '</span>'
      +   '<span class="chip s' + idx + '">' + st.s.label + '</span></div>'
      + '<div class="ono">' + esc(o.no) + '</div>'
      + '<div class="ometa">' + dtText(o.at) + ' 접수 · ' + esc(payLabel(o.pay))
      +   ' · 배송 ' + (o.shipDate ? mdText(o.shipDate) : "협의") + '</div>'
      + '<ul class="olines">' + lines + '</ul>'
      + '<div class="ototal">총 ' + Number(o.kinds || (o.items || []).length) + '종 · ' + kgText(o.kg) + '<b>' + won(o.total) + '원</b></div>'
      + '<div class="oclient"><span>☎ <a class="tel" href="tel:' + esc(digits(o.phone)) + '"><b>' + esc(o.phone) + '</b></a></span>'
      + '<span>📍 ' + esc(o.addr) + '</span></div>'
      + (o.memo ? '<div class="omemo">“' + esc(o.memo) + '”</div>' : '')
      + '<div class="osteps">' + steps + '</div>'
      + '</article>';
  }).join("");
}

/* ── 품목·단가 ── */
function renderItems(){
  var h = "";
  ITEMS.forEach(function(it){
    var sold = itemSoldOut(it.id), price = itemPrice(it.id);
    h += '<div class="irow' + (sold ? ' sold' : '') + '" data-row="' + it.id + '">'
      +  '<div class="th"><img src="' + IMG[it.img] + '" alt="" loading="lazy" decoding="async"></div>'
      +  '<div><div class="nm">' + esc(it.name) + '</div>'
      +    '<div class="sp">' + esc(it.grade) + ' · ' + esc(it.spec) + ' · ' + esc(it.origin) + '</div></div>'
      +  '<div class="pr"><input type="text" inputmode="numeric" data-price="' + it.id + '" value="' + won(price) + '" aria-label="' + esc(it.name) + ' 박스 단가"><span class="u">원</span></div>'
      +  '<div class="tglrow">'
      +    '<button type="button" class="tgl' + (sold ? ' on' : '') + '" data-sold="' + it.id + '" role="switch" aria-checked="' + (sold ? "true" : "false") + '" aria-label="' + esc(it.name) + ' 품절"></button>'
      +    '<span class="tgl-lb' + (sold ? ' on' : '') + '">' + (sold ? "품절 · 손님 화면에서 담기 막힘" : "판매중") + '</span>'
      +  '</div>'
      + '</div>';
  });
  document.getElementById("ilist").innerHTML = h;
  var minEl = document.getElementById("minOrder");
  if (!state.editing) minEl.value = won(minOrder()).replace(/,/g, "");
}
function markDirty(){
  state.dirty = true;
  state.editing = true;
  document.getElementById("dirty").textContent = "저장하지 않은 변경이 있습니다";
}
function saveCatalog(){
  var doc = { minOrder: Number(digits(document.getElementById("minOrder").value) || MIN_ORDER_DEFAULT), items: {}, updatedAt: Date.now() };
  if (!doc.minOrder || doc.minOrder < 0) doc.minOrder = MIN_ORDER_DEFAULT;
  ITEMS.forEach(function(it){
    var inp = document.querySelector('[data-price="' + it.id + '"]');
    var tgl = document.querySelector('[data-sold="' + it.id + '"]');
    var p = Number(digits(inp ? inp.value : "") || 0);
    if (!p) p = it.price;
    doc.items[it.id] = { price: p, soldout: tgl ? tgl.classList.contains("on") : false };
  });
  catalogPush(doc).then(function(okPush){
    catalogFresh();
    state.dirty = false;
    state.editing = false;
    document.getElementById("dirty").textContent = "";
    document.getElementById("minOrder").value = won(doc.minOrder).replace(/,/g, "");
    renderItems(); renderSync();
    toast(okPush ? "단가·품절을 저장했습니다 · 손님 화면에 반영됩니다" : "이 기기에 저장했습니다 · 인터넷 연결되면 함께 저장됩니다");
  });
}
function renderSync(){
  var el = document.getElementById("syncState");
  if (!el) return;
  el.textContent = sbOn() ? "공용 DB 연결됨 · 기기 간 동기화" : "이 기기 저장만 (오프라인)";
  el.className = "sync" + (sbOn() ? "" : " off");
}

/* ── 이벤트 ── */
document.querySelector(".tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if (!b) return;
  state.tab = b.getAttribute("data-tab");
  Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){ x.classList.toggle("on", x === b); });
  document.getElementById("tab-orders").hidden = state.tab !== "orders";
  document.getElementById("tab-items").hidden = state.tab !== "items";
  if (state.tab === "items" && !state.dirty) renderItems();
  window.scrollTo(0, 0);
});
document.getElementById("filters").addEventListener("click", function(e){
  var b = e.target.closest("button[data-f]");
  if (!b) return;
  state.filter = b.getAttribute("data-f");
  renderFilters(); renderOrders();
});
document.getElementById("olist").addEventListener("click", function(e){
  var b = e.target.closest("button[data-st]");
  if (!b) return;
  var no = b.getAttribute("data-no"), st = b.getAttribute("data-st");
  var cur = orders().filter(function(o){ return o.no === no; })[0];
  if (!cur || (cur.status || "received") === st) return;
  orderSetStatus(no, st);
  renderStats(); renderFilters(); renderOrders(); renderSync();
  toast(cur.shop + " · " + statusInfo(st).s.label + "으로 바꿨습니다");
});
document.getElementById("ilist").addEventListener("click", function(e){
  var t = e.target.closest(".tgl");
  if (!t) return;
  var on = t.classList.toggle("on");
  t.setAttribute("aria-checked", on ? "true" : "false");
  var lb = t.parentNode.querySelector(".tgl-lb");
  lb.textContent = on ? "품절 · 손님 화면에서 담기 막힘" : "판매중";
  lb.classList.toggle("on", on);
  t.closest(".irow").classList.toggle("sold", on);
  markDirty();
});
document.getElementById("ilist").addEventListener("input", function(e){
  if (!e.target.matches('input[data-price]')) return;
  var d = digits(e.target.value);
  e.target.value = d ? won(Number(d)) : "";
  markDirty();
});
document.getElementById("minOrder").addEventListener("input", function(){
  var v = digits(this.value);
  this.value = v ? won(v) : "";
  markDirty();
});
document.getElementById("btnSave").addEventListener("click", saveCatalog);
document.getElementById("btnReset").addEventListener("click", function(){
  state.editing = false;
  state.dirty = false;
  document.getElementById("dirty").textContent = "";
  renderItems();
  toast("저장된 단가로 되돌렸습니다");
});

/* ── 시작 ── */
renderStats(); renderFilters(); renderOrders(); renderItems(); renderSync();

catalogFresh();
catalogPull().then(function(){
  if (catalogFresh()) { renderItems(); renderStats(); }
});
orderPull().then(function(changed){ if (changed) { renderStats(); renderFilters(); renderOrders(); } });
setInterval(function(){
  if (document.hidden) return;
  catalogPull().then(function(){
    if (catalogFresh() && !state.dirty) { state.editing = false; renderItems(); }
  });
  orderPull().then(function(changed){ if (changed) { renderStats(); renderFilters(); renderOrders(); } });
}, SB_POLL_MS);
document.addEventListener("visibilitychange", function(){
  if (document.hidden) return;
  orderPull().then(function(changed){ if (changed) { renderStats(); renderFilters(); renderOrders(); } });
});
</script>
</body>
</html>
